name: NV-026 locked identity dependencies (temporary)
on:
  push:
    branches: [feature/NV-026-local-identity-engine]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv lock
      - name: Emit resolved reproducible lockfile for versioned review
        run: |
          python - <<'PY'
          from pathlib import Path
          print("---BEGIN_NOVERA_LOCK_NV026---")
          print(Path("uv.lock").read_text(encoding="utf-8"), end="")
          print("---END_NOVERA_LOCK_NV026---")
          PY
      - name: Inspect exact Ruff formatting diff
        run: |
          uv sync --locked --group dev
          uv run --offline --locked ruff format --diff backend/src/novera/identity.py backend/tests/test_identity.py scripts/bootstrap_local_identity.py
