name: NV-026 exact formatter preview (temporary)
on:
  push:
    branches: [feature/NV-026-local-identity-engine]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --locked --group dev
      - run: uv run --offline --locked ruff format --diff backend/tests/test_identity_bootstrap.py || true
