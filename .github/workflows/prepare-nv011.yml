name: Frontend research interface quality

on:
  push:
    branches:
      - feature/NV-011-synthetic-web-ui

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reproducible Python lab
        run: |
          python -m pip install uv==0.11.27
          uv sync --locked --group dev
      - name: Materialize strictly synthetic finance report
        run: uv run --offline --locked python frontend/scripts/materialize_demo.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build, test and audit locked React interface
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund && npm run build && npm run test && npm audit --audit-level=high
