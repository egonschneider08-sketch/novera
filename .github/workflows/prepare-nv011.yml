name: Prepare synthetic frontend assets (temporary NV-011)

on:
  push:
    branches:
      - feature/NV-011-synthetic-web-ui

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reproducible Python lab
        run: |
          python -m pip install uv==0.11.27
          uv sync --locked --group dev
      - name: Materialize strictly synthetic finance report
        run: uv run --offline --locked python frontend/scripts/materialize_demo.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund && npm run build && npm run test && npm audit --omit=dev --audit-level=high
      - name: Export generated UTF-8 manifest/lock in job logs for reviewed GitHub commit
        run: |
          python - <<'PY'
          from pathlib import Path
          for name, path in [
              ("FIXTURE", Path("frontend/src/data/scenarios.json")),
              ("LOCK", Path("frontend/package-lock.json")),
              ("CSV", Path("frontend/src/data/comparison.csv")),
          ]:
              print(f"---BEGIN_NOVERA_{name}---")
              print(path.read_text(encoding="utf-8"), end="")
              print(f"---END_NOVERA_{name}---")
          PY
