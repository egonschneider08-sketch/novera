name: Prepare NV-014 API lockfile (temporary)

on:
  push:
    branches:
      - feature/NV-014-synthetic-research-api

permissions:
  contents: read

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin uv and resolve API dependencies
        run: |
          python -m pip install uv==0.11.27
          uv lock
      - name: Print reviewed lockfile for commit
        run: |
          python - <<'PY'
          from pathlib import Path
          print("---BEGIN_NOVERA_API_LOCK---")
          print(Path("uv.lock").read_text(encoding="utf-8"), end="")
          print("---END_NOVERA_API_LOCK---")
          PY
