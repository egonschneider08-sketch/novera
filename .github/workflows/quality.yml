name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'perf/**'
      - 'experiment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.11.27
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --offline --locked ruff check .
      - name: Format
        run: uv run --offline --locked ruff format --check .
      - name: Tests (no provider credentials)
        run: uv run --offline --locked pytest -q
      - name: Secret scanner negative control
        run: uv run --offline --locked python scripts/check_secrets.py --self-test
      - name: Secret scan (no verification requests)
        run: uv run --offline --locked python scripts/check_secrets.py
      - name: Export locked dependencies including development tools
        run: uv export --locked --all-groups --no-emit-project --no-hashes --output-file /tmp/novera-requirements.txt
      - name: Audit published dependencies
        run: uv run --locked pip-audit --no-deps --disable-pip --progress-spinner off -r /tmp/novera-requirements.txt
