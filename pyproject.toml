[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "novera"
version = "0.1.0"
description = "Fundacao da plataforma de pesquisa de investimentos Novera"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "pip-audit==2.9.0",
    "pytest>=9.0.3,<10",
    "ruff==0.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/novera"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
